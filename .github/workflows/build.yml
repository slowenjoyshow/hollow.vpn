name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # В проекте нет gradle wrapper, поэтому ставим Gradle напрямую (AGP 8.7 требует 8.9+).
      # Android SDK уже установлен на образе ubuntu-latest.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch native cores (hev-socks5-tunnel, Xray)
        run: ./scripts/fetch-natives.sh

      - name: Build AmneziaWG 2.0 library
        continue-on-error: true   # без неё работают VLESS/SOCKS5, а AmneziaWG покажет понятную ошибку
        run: ./scripts/build-awg.sh

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hollow-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
